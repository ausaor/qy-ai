<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青语 · 问候</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f7f1e9; font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;">
<!-- 邮件外层容器：邮件客户端兼容的 table 布局 -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color: #f7f1e9; padding: 32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                   style="max-width: 600px; width: 100%; background-color: #fffdfa; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 24px rgba(196, 148, 106, 0.10);">

                <!-- 顶部：简约暖色区域，展示项目名称「青语」 -->
                <tr>
                    <td align="center" style="padding: 44px 32px 36px;">
                        <div style="font-size: 30px; font-weight: 600; letter-spacing: 12px; color: #c97c5d; margin-bottom: 14px;">青 语</div>
                        <div style="width: 36px; height: 2px; background-color: #e8c4ab; margin: 0 auto 12px;"></div>
                        <div style="font-size: 12px; letter-spacing: 3px; color: #b29886;">QING YU · 一份来自青语的问候</div>
                    </td>
                </tr>

                <!-- 主体：开头敬语（大模型生成）与问候内容 -->
                <tr>
                    <td style="padding: 24px 40px 16px;">
                        <div style="font-size: 16px; color: #4d443c; line-height: 1.9;"
                             th:text="${salutation}">亲爱的朋友：</div>
                        <div style="font-size: 16px; color: #6b6057; line-height: 1.9; margin-top: 12px;"
                             th:text="${greeting}">愿你今天也有好心情。</div>
                    </td>
                </tr>

                <!-- 落款：发送人「聴夏」 -->
                <tr>
                    <td align="right" style="padding: 8px 40px 16px;">
                        <div style="font-size: 15px; color: #c97c5d; font-weight: 500;">聴夏</div>
                        <div style="font-size: 12px; color: #b3a396; margin-top: 4px;">敬上</div>
                    </td>
                </tr>

                <!-- 分隔线 -->
                <tr>
                    <td style="padding: 0 40px;">
                        <div style="border-top: 1px solid #f0e6d9;"></div>
                    </td>
                </tr>

                <!-- 页脚 -->
                <tr>
                    <td align="center" style="padding: 24px 40px 36px;">
                        <div style="font-size: 12px; color: #b3a396; line-height: 2;">本邮件由 青语 · QyAI 系统自动发送 · 发送人 聴夏</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
